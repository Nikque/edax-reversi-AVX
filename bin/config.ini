# Timed saves of the in-progress opening book, in minutes.
# Set to 0 to disable timed saves. Completed-round saves are configured below.
book-save-interval = 360

# Save book deviate/deviate2/deviate3 progress after this many productive rounds.
# 0 saves only after learning finishes; 1 keeps the original every-round behavior.
# A round is both passes of deviate, or one pass of deviate2/deviate3.
# Timed saves above remain enabled independently.
book-deviate-save-rounds = 1

# Save the book to <book-file>.mrg (for example data/book.dat.mrg) after each book merge.
# on saves automatically; off keeps the original behavior (use "book save" yourself).
book-merge-auto-save = on
