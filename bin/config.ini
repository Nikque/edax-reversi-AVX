# Edax settings. See "Settings (config.ini)" in README-NIKQUE.en.md
# or "設定（config.ini）" in README-NIKQUE.ja.md. Command-line options override them.
#
# Each line is "name = value". The "=" and the spaces around it are optional, names and the
# words on/off/auto ignore the case, and spaces, "_" and "-" in names are the same
# (book-depth, book_depth and "book depth" are the same setting). "#" starts a comment.
# An unknown name is reported when Edax starts.

# ---- Startup settings (initial values; the commands of the prompt can change them later) ----

# Search level (0 to 60), as with the "level" command. With a time control (-t or -move-time
# on the command line) this level does not cap the search; use -l to cap it.
level = 18

# Number of search threads: 1 to the number of logical CPUs, or auto (all logical CPUs).
n-tasks = auto

# Depth of the opening book, as with the "book depth" command: auto keeps the depth saved in
# the book file (data/book.dat), a number from 1 to 60 sets it (and is saved with the book).
book-depth = auto

# Play from the opening book: on or off.
book-usage = on

# ---- Other settings ----

# Timed saves of the in-progress opening book, in minutes.
# Set to 0 to disable timed saves. Completed-round saves are configured below.
book-save-interval = 360

# Save book deviate/deviate2/deviate3 progress after this many productive rounds.
# 0 saves only after learning finishes; 1 keeps the original every-round behavior.
# A round is both passes of deviate, or one pass of deviate2/deviate3.
# Timed saves above remain enabled independently.
book-deviate-save-rounds = 1

# Save the book to <book-file>.mrg (for example data/book.dat.mrg) after each book merge.
# on saves automatically; off keeps the original behavior (use "book save" yourself).
book-merge-auto-save = on

# Size of the search hash table: a number n gives 2^n entries (about 27 x 2^n bytes for
# the three tables; 21 is the built-in default), or auto chooses it from the number of search
# threads (n-tasks) and the memory size: 21 for 1-3 threads, 22 for 4-15, 23 for 16-63.
# -h on the command line overrides this setting.
hash-table-size = auto

# Book positions expanded at the same time by book deviate/deviate2/deviate3/enhance/play.
# 1 keeps the original one-by-one expansion. With n > 1, n positions are searched at the same
# time with n-tasks / n threads each; auto uses 2 threads per search up to level 18, 4 up to
# level 24 and 8 above (for example 16 positions with n-tasks 32 at level 18), which is several
# times faster at low levels. The book is not the same as with 1: read the notes of the README.
# Each of them has its own hash tables (sized for its threads with hash-table-size = auto).
book-expand-tasks = auto

# Games learned at the same time by book store, book add and book learn (and by edax_runner).
# auto (the default) is n-tasks games, one thread each: the games are played at the same time
# (book learn, edax_runner), then all their positions are searched at the same time, one thread
# each, and added to the book. With a number n, n games at the same time, with n-tasks / n
# threads each. With many threads, auto is about 3 times faster than 1; a small number (2, 4)
# gains little.
# 1 is the learning of the previous versions: the positions are searched one after the other,
# with all the threads. The book learned with auto is not exactly the same (it differs about as
# much as when the number of threads changes): read the notes of the README.
# The leaf searches done while the links of a book are rebuilt (book fix, merge, import, ...)
# follow the same setting: at the same time, or one after the other with 1.
# Each one-thread search has its own hash tables: 14 MB up to level 18, 28 MB up to level 21,
# 57 MB above, whatever hash-table-size is (only a smaller number is used as it is). With fewer
# searches than threads, each search uses several threads and larger tables (the same total at most).
book-store-tasks = auto

# Probcut error model of the search: standard (default) or refit (experimental).
# refit reads more in the opening and middle game and less near the endgame; it changes the
# search results (and the books learned with it). Read the notes of the README before using it.
probcut-model = standard
